  <text x="484" y="396" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#556070">EF Core + Audit Logs</text>

  <!-- Row 3: Python + External APIs -->
  <rect x="120" y="500" width="360" height="200" rx="16" fill="#ffffff" stroke="#d5dbe6" stroke-width="2" />
  <text x="150" y="535" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#1c2430">MarketBrain (Python)</text>
  <rect x="150" y="555" width="160" height="38" rx="8" fill="#e9f0ff" />
  <text x="164" y="579" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#556070">FastAPI Engine</text>
  <rect x="150" y="605" width="160" height="38" rx="8" fill="#e9f0ff" />
  <text x="164" y="629" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#556070">NumPy Signals</text>
  <rect x="330" y="605" width="130" height="38" rx="8" fill="#e9f0ff" />
  <text x="344" y="629" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#556070">BS4 Scraper</text>
  <text x="150" y="665" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#556070">Fundamentus fundamentals</text>

  <rect x="540" y="520" width="200" height="90" rx="14" fill="#ffffff" stroke="#d5dbe6" stroke-width="2" />
  <text x="560" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#1c2430">Brapi API</text>
  <text x="560" y="582" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#556070">B3 prices</text>

  <rect x="780" y="520" width="200" height="90" rx="14" fill="#ffffff" stroke="#d5dbe6" stroke-width="2" />
  <text x="800" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#1c2430">CoinGecko</text>
  <text x="800" y="582" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#556070">Crypto prices</text>

  <!-- Row 4: Database (Updated Box size and content for users/portfolios) -->
  <rect x="800" y="680" width="260" height="130" rx="16" fill="#ffffff" stroke="#d5dbe6" stroke-width="2" />
  <text x="820" y="715" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#1c2430">PostgreSQL</text>
  <text x="820" y="740" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#556070">Search Logs &amp; Audit Trails</text>
  <text x="820" y="760" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#556070">User Portfolios (Qty &amp; Avg Price)</text>
  <text x="820" y="780" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#556070">Secure BCrypt Password Hashes</text>

  <!-- Lines (Adjusted DB Arrow) -->
  <path d="M340 160 L420 160" stroke="#8a97a8" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
  <path d="M570 215 L600 265" stroke="#8a97a8" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
  <path d="M520 445 L300 500" stroke="#8a97a8" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
  <path d="M650 445 L640 505" stroke="#8a97a8" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
  <path d="M760 445 L870 505" stroke="#8a97a8" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
  <path d="M900 445 L900 665" stroke="#8a97a8" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />

  <text x="545" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#556070">HTTP GET</text>
  <text x="500" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#556070">Math + Fundamentals</text>
  <text x="600" y="480" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#556070">B3 Data</text>
  <text x="880" y="480" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#556070">Crypto Data</text>
  <text x="910" y="650" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#556070">Users, Portfolios &amp; Logs</text>
</svg>