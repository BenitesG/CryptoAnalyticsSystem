<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#8a97a8" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="900" fill="#f6f7fb" />

  <text x="40" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1c2430">Multi-Asset Market Analytics System</text>
  <text x="40" y="75" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#556070">C# Orchestrator + Python Analytics (Fundamentus)</text>

  <!-- Row 1: User + UI -->
  <rect x="120" y="120" width="220" height="80" rx="14" fill="#ffffff" stroke="#d5dbe6" stroke-width="2" />
  <text x="150" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#1c2430">User / Client</text>
  <text x="150" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#556070">Multi-asset queries</text>

  <rect x="420" y="105" width="300" height="110" rx="14" fill="#ffffff" stroke="#d5dbe6" stroke-width="2" />
  <rect x="440" y="125" width="92" height="28" rx="6" fill="#e9f0ff" />
  <text x="455" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#2f6fed">UI</text>
  <text x="440" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#1c2430">Streamlit Dashboard</text>
  <text x="440" y="195" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#556070">Plotly, Auth &amp; Portfolios</text>

  <!-- Row 2: C# Gateway (centered) -->
  <rect x="230" y="265" width="740" height="180" rx="16" fill="#ffffff" stroke="#d5dbe6" stroke-width="2" />
  <text x="260" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#1c2430">MarketDataApi (C# .NET 8)</text>
  <rect x="260" y="320" width="220" height="42" rx="8" fill="#e9f0ff" />
  <text x="274" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#556070">API Gateway / Router</text>
  <rect x="500" y="320" width="210" height="42" rx="8" fill="#e9f0ff" />
  <text x="514" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#556070">In-memory Cache</text>
  <rect x="260" y="370" width="190" height="42" rx="8" fill="#e9f0ff" />
  <text x="274" y="396" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#556070">Polly Retry</text>
